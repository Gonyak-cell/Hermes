name: Hermes Verification Trust

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  hermes-verification-trust:
    name: Hermes verification trust
    runs-on: ubuntu-latest
    env:
      HERMES_ZENDD_PROJECT_ROOT: ${{ github.workspace }}/.ci/zendd-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate core contracts
        run: npm run validate:core

      - name: Create Zendd no-write fixture checkout
        run: |
          mkdir -p "$HERMES_ZENDD_PROJECT_ROOT/frontend/src"
          mkdir -p "$HERMES_ZENDD_PROJECT_ROOT/backend/tests"
          mkdir -p "$HERMES_ZENDD_PROJECT_ROOT/backend/migrations"
          mkdir -p "$HERMES_ZENDD_PROJECT_ROOT/backend/app/routers"
          mkdir -p "$HERMES_ZENDD_PROJECT_ROOT/backend/app/services/ldd_fact_engine"
          mkdir -p "$HERMES_ZENDD_PROJECT_ROOT/electron"
          cat > "$HERMES_ZENDD_PROJECT_ROOT/package.json" <<'JSON'
          {
            "name": "zendd-ci-no-write-fixture",
            "private": true,
            "scripts": {
              "dev": "echo no-write-fixture",
              "build": "echo no-write-fixture",
              "build:frontend": "echo no-write-fixture",
              "lint:frontend": "echo no-write-fixture",
              "dev:backend": "echo no-write-fixture",
              "dev:electron": "echo no-write-fixture",
              "dist:win": "echo no-write-fixture",
              "setup": "echo no-write-fixture"
            }
          }
          JSON
          cat > "$HERMES_ZENDD_PROJECT_ROOT/frontend/package.json" <<'JSON'
          {
            "name": "zendd-ci-no-write-fixture-frontend",
            "private": true,
            "scripts": {
              "lint": "echo no-write-fixture",
              "test": "echo no-write-fixture",
              "test:coverage": "echo no-write-fixture",
              "test:e2e": "echo no-write-fixture",
              "build": "echo no-write-fixture",
              "preview": "echo no-write-fixture"
            }
          }
          JSON
          cat > "$HERMES_ZENDD_PROJECT_ROOT/frontend/vite.config.ts" <<'EOF'
          export default {};
          EOF
          cat > "$HERMES_ZENDD_PROJECT_ROOT/frontend/src/index.tsx" <<'EOF'
          export const fixture = "zendd-ci-no-write-fixture";
          EOF
          cat > "$HERMES_ZENDD_PROJECT_ROOT/backend/pyproject.toml" <<'TOML'
          [project]
          name = "zendd-ci-no-write-fixture-backend"
          version = "0.0.0"
          requires-python = ">=3.11"
          TOML
          cat > "$HERMES_ZENDD_PROJECT_ROOT/backend/alembic.ini" <<'EOF'
          [alembic]
          script_location = migrations
          EOF
          touch "$HERMES_ZENDD_PROJECT_ROOT/backend/tests/.keep"
          touch "$HERMES_ZENDD_PROJECT_ROOT/backend/migrations/.keep"
          cat > "$HERMES_ZENDD_PROJECT_ROOT/electron/main.cjs" <<'EOF'
          module.exports = {};
          EOF
          cat > "$HERMES_ZENDD_PROJECT_ROOT/backend/app/routers/vdr.py" <<'EOF'
          ROUTER_MARKER = "fixture"
          EOF
          cat > "$HERMES_ZENDD_PROJECT_ROOT/backend/app/routers/ldd_fact_engine.py" <<'EOF'
          ROUTER_MARKER = "fixture"
          EOF
          cat > "$HERMES_ZENDD_PROJECT_ROOT/backend/app/services/vdr_classification_service.py" <<'EOF'
          SERVICE_MARKER = "fixture"
          EOF
          cat > "$HERMES_ZENDD_PROJECT_ROOT/backend/app/services/ldd_source_controls.py" <<'EOF'
          SERVICE_MARKER = "fixture"
          EOF
          cat > "$HERMES_ZENDD_PROJECT_ROOT/backend/app/services/ldd_fact_engine/client_output_gate.py" <<'EOF'
          SERVICE_MARKER = "fixture"
          EOF
          git -C "$HERMES_ZENDD_PROJECT_ROOT" init -q
          git -C "$HERMES_ZENDD_PROJECT_ROOT" config user.name "Hermes CI"
          git -C "$HERMES_ZENDD_PROJECT_ROOT" config user.email "hermes-ci@example.invalid"
          git -C "$HERMES_ZENDD_PROJECT_ROOT" add .
          git -C "$HERMES_ZENDD_PROJECT_ROOT" commit -q -m "Create Zendd fixture checkout"

      - name: Validate kernel cutover prerequisites
        run: |
          npm run platform:agent-runtime-pilot-freeze -- --check
          npm run platform:agent-runtime-activation-bridge -- --check
          npm run platform:domain-agent-no-write-pilot -- --check
          npm run platform:agent-operator-console-v0 -- --check
          npm run platform:kernel-contract-baseline -- --check
          npm run platform:kernel-spec-status-reconciliation -- --check
          npm run platform:kernel-claim-evidence-gate-engine -- --check
          npm run platform:kernel-artifact-check-receipt-engine -- --check
          npm run platform:kernel-projection-freeze -- --check
          npm run platform:harness-native-cutover-adapter -- --check
          npm run platform:kernel-harness-native-cutover-freeze -- --check

      - name: Generate long-range platform prerequisites
        run: |
          npm run platform:hue-keynote-roadmap-alignment
          npm run platform:nous-overlap-audit
          npm run platform:nous-non-adoption-reversal
          npm run platform:runtime-governance-restore
          npm run platform:human-approved-limited-execution
          npm run platform:controlled-write-operator-console-v2
          npm run platform:memory-event-observability-plane
          npm run platform:connectors-data-governance
          npm run platform:domain-pack-ecosystem
          npm run platform:production-governance-work-os-freeze
          npm run platform:production-governance-work-os-freeze -- --check

      - name: Validate source trust kernel
        run: |
          npm run platform:verification-trust-kernel
          npm run platform:verification-trust-kernel -- --check

      - name: Validate activation trust
        run: |
          npm run platform:verification-trust-activation
          npm run platform:verification-trust-activation -- --check

      - name: Validate live external evidence capture
        run: npm run platform:live-external-verification-evidence -- --check

      - name: Validate external enforcement
        run: npm run platform:external-verification-enforcement -- --check

      - name: Run activation tests
        run: node --test test/platform-verification-trust-activation.test.mjs

      - name: Run external enforcement tests
        run: node --test test/platform-external-verification-enforcement.test.mjs

      - name: Check diff whitespace
        run: git diff --check

      - name: Generate verification artifact
        run: |
          npm run platform:verification-trust-activation
          npm run platform:live-external-verification-evidence
          npm run platform:external-verification-enforcement
          mkdir -p dist
          tar -czf dist/hermes-verification-trust-artifacts.tgz \
            artifacts/platform-verification-trust-activation/latest \
            artifacts/platform-external-verification-enforcement/latest \
            artifacts/platform-external-verification-enforcement/live-evidence/latest \
            artifacts/platform-external-verification-enforcement/github \
            artifacts/platform-external-verification-enforcement/attestation \
            artifacts/platform-external-verification-enforcement/review

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-verification-trust-artifacts
          path: dist/hermes-verification-trust-artifacts.tgz

      - name: Generate artifact attestation
        if: ${{ github.event.repository.visibility != 'private' }}
        uses: actions/attest@v4
        with:
          subject-path: dist/hermes-verification-trust-artifacts.tgz

      - name: Record artifact attestation unavailable
        if: ${{ github.event.repository.visibility == 'private' }}
        run: echo "GitHub artifact attestations are unavailable for user-owned private repositories; attestation evidence remains BLOCK."
